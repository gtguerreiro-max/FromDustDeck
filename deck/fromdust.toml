# From Dust (ReXGlue port) settings for the Steam Deck. Read from beside fromdust.exe at every
# start. An option on the command line (Steam launch options: `%command% --section.name=value`)
# overrides the same setting for that session.

# Frame rate above the console's 30 FPS (src/frame_rate.cpp). The game presents every second
# guest vblank, so a 120 Hz vblank (ui.video_mode_refresh_rate below) lets it run up to 60 FPS.
# The world (water, lava, plants, people) keeps its 30 steps per second, and even pacing holds
# 60 FPS, or 30 when the frames can't keep up, so each world step stays on screen evenly. Don't
# use the Deck's 40 FPS limit: 40 doesn't divide the world's 30 steps, so the water would move in
# small jerks. 0 for fromdust_world_hz steps the world once per frame, as the console does
# (faster above 30 FPS).
fromdust_world_hz = 30
fromdust_fps_limit = 60
fromdust_even_pacing = true

# Window: the Deck's 1280x800 panel, full screen. The game renders 16:9 and is letterboxed.
[ui]
window_width = 1280
window_height = 800
fullscreen = true
video_mode_refresh_rate = 120

# The full game's license (XBLA titles check it; with 0 the game runs as its trial, with
# "Unlock full game" in the menu).
[kernel]
license_mask = 1

# ReXGlue's Xenos GPU driver, when it draws (F9): present in step with the display, 16x
# anisotropic filtering (the terrain is seen at grazing angles; levels 0 off ... 5 16x, -1 the
# game's own), the console's internal resolution (2 doubles each axis, about 4x the pixel work).
# PGR4Native's Deck pacing patches (present on the vblank, a deadline timer for the vblank
# thread, precise register waits, fast ring wake-ups) are not ported to ReXGlue v0.11 yet.
[gpu]
vsync = true
anisotropic_override = 5
resolution_scale_x = 1
resolution_scale_y = 1

# Shader pipelines are compiled on worker threads (-1: as many as the CPU has, minus one).
[gpu.d3d12]
pipeline_creation_threads = -1

# ReXNative draws and presents the game; its settings menu is F1 or Back+Start on the pad, and
# saves its choices here. The frames are scaled to the panel with AMD FSR 1.
[rexnative]
fsr = true
